# Dolphin GCPadNew.ini, and the source of truth for WiiCompiled's controls.
# home/programs/wiicompiled converts it into the [controller] section of
# ~/.local/share/WiiCompiled/Config.toml on activation; it stays valid Dolphin
# syntax, so it can be copied to ~/.config/dolphin-emu/GCPadNew.ini as-is.
#
# Taken from the working Dolphin PS4 profile, with three changes:
#
#   * Triggers/R added, on L1. Nothing was bound to it, and drift needs a
#     *button*: a mapped button is what stops the R2 axis from driving
#     GameCube R, which is what frees R2 for accelerate.
#   * Buttons/Y set to Circle, and Buttons/Z dropped. Both sat on keyboard keys
#     (`S`, `D`) left over from Dolphin's default keyboard profile rather than
#     being real pad bindings.
#
# Stick and calibration entries are kept for Dolphin's sake; WiiCompiled maps
# the sticks natively and ignores them.

[GCPad1]
Device = SDL/0/PS4 Controller
Buttons/A = `Trigger R`
Buttons/B = `Button W`
Buttons/X = `Button N`
Buttons/Y = `Button E`
Buttons/Start = Start
Triggers/L = `Trigger L`
Triggers/R = `Shoulder L`
D-Pad/Up = `Shoulder R`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
Main Stick/Up = `Left Y+`
Main Stick/Down = `Left Y-`
Main Stick/Left = `Left X-`
Main Stick/Right = `Left X+`
C-Stick/Up = `Right Y+`
C-Stick/Down = `Right Y-`
C-Stick/Left = `Right X-`
C-Stick/Right = `Right X+`
